<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ดูแลกัน</title>
<style>
:root{--bg:#E9EEF1;--surface:#FFFFFF;--ink:#14262F;--muted:#56696F;--line:#BCCBD1;--accent:#0E6A6B;--on:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Leelawadee UI","Thonburi","Noto Sans Thai",system-ui,sans-serif}
header{background:var(--surface);padding:12px 16px 0;border-bottom:1px solid var(--line);position:sticky;top:0}
h1{font-size:19px;margin:0}
.sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:inherit;font-weight:500;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:700}
main{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin:0 auto}
.card{background:var(--surface);border-radius:14px;padding:14px}
.card h2{font-size:16px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding:8px 0}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:1.5px solid var(--ink);white-space:nowrap}
.pill.done{background:var(--ink);color:var(--surface)}
.pill.wait{border-color:var(--line);color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
svg text{fill:var(--muted);font-size:10px}
form{display:flex;flex-direction:column;gap:12px}
.fields{display:flex;gap:10px;flex-wrap:wrap}
label{flex:1 1 90px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input{font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%}
button.primary{font:inherit;font-weight:700;min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--on)}
button.primary:disabled{opacity:.5}
.msg{font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>ดูแลกัน</h1>
  <div class="sub" id="who">กำลังโหลด…</div>
  <div class="tabs" id="tabs" hidden>
    <button id="t-today" data-tab="today">วันนี้</button>
    <button id="t-bp" data-tab="bp">ความดัน 7 วัน</button>
    <button id="t-form" data-tab="form" hidden>บันทึกความดัน</button>
  </div>
</header>
<main id="main"><div class="card">กำลังโหลดข้อมูล…</div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = "2011856498-srnlU1mj";
const API = "https://iefhpnprkchrekkxogni.supabase.co/functions/v1/line-webhook";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data = null, tab = "today", token = "";
const ERR = { unauthorized: "ยืนยันตัวตนไม่สำเร็จ กรุณาปิดแล้วเปิดหน้านี้ใหม่จากแชทดูแลกัน", not_member: "บัญชี LINE นี้ยังไม่ได้เข้าบ้าน กรุณาพิมพ์รหัสเชิญในแชทดูแลกันก่อน", not_configured: "ระบบยังตั้งค่าไม่เสร็จ", invalid: "ตัวเลขดูไม่ถูกต้อง กรุณาตรวจอีกครั้ง", future: "เวลาที่วัดต้องไม่เกินเวลาปัจจุบัน", forbidden: "เฉพาะผู้ดูแลเท่านั้นที่บันทึกได้" };
async function call(body) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-liff-token": token }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "bad" }));
  if (!r.ok) throw new Error(ERR[j.error] || "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง");
  return j;
}
const pill = s => `<span class="pill ${s === "บันทึกแล้ว" ? "done" : s === "ยังไม่มีบันทึก" ? "wait" : ""}">${esc(s)}</span>`;
function chart(days) {
  const X = i => 36 + i * 44, Y = v => 10 + (200 - v) / 160 * 120;
  const path = k => { let d = "", pen = false; days.forEach((x, i) => { if (!x.v) { pen = false; return } d += (pen ? "L" : "M") + X(i) + " " + Y(x.v[k]) + " "; pen = true }); return d };
  let g = ""; for (let v = 40; v <= 200; v += 40) g += `<line x1="32" x2="308" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="28" y="${Y(v) + 3}" text-anchor="end">${v}</text>`;
  const dots = k => days.map((x, i) => x.v ? `<circle cx="${X(i)}" cy="${Y(x.v[k])}" r="3.5" fill="${k === "s" ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>` : "").join("");
  return `<svg viewBox="0 0 320 154" width="100%" role="img" aria-label="กราฟความดัน 7 วัน">${g}<path d="${path("s")}" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="${path("d")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"/>${dots("s")}${dots("d")}${days.map((x, i) => `<text x="${X(i)}" y="148" text-anchor="middle">${x.lab}</text>`).join("")}</svg>
  <div class="note">จุดทึบ = ตัวบน · จุดโปร่ง เส้นประ = ตัวล่าง (mmHg) · ใช้ค่าแรกของแต่ละวัน · วันที่ไม่มีบันทึกเว้นว่าง</div>`;
}
function render() {
  ["today", "bp", "form"].forEach(k => $("t-" + k).setAttribute("aria-selected", k === tab));
  const m = $("main");
  if (tab === "today") {
    m.innerHTML = `<div class="card"><h2>งานวันนี้</h2>${data.plans.map(p => `<div class="row"><span>${esc(p.time)} ${esc(p.label)}</span>${pill(p.status)}</div>`).join("") || "ยังไม่มีรายการในแผน"}
      <div class="note">ยังไม่มีบันทึก ไม่ได้แปลว่าไม่ได้ทำ</div></div>
      <div class="card"><h2>บันทึกวันนี้</h2>${data.logs.length ? `<table><tr><th>เวลา</th><th>ผู้ดูแลบันทึกว่า</th></tr>${data.logs.map(l => `<tr><td>${esc(l.time)}</td><td>${esc(l.text)}</td></tr>`).join("")}</table>` : "ยังไม่มีบันทึกวันนี้"}</div>`;
  } else if (tab === "bp") {
    const days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(data.today + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - i); const iso = d.toISOString().slice(0, 10); days.push({ lab: d.getUTCDate() + "/" + (d.getUTCMonth() + 1), v: data.bp.find(b => b.date === iso) || null }); }
    m.innerHTML = `<div class="card"><h2>ความดัน 7 วัน</h2>${chart(days)}</div>
      <div class="card"><h2>ทุกค่าที่บันทึก</h2>${data.bp.length ? `<table><tr><th>วันที่</th><th>เวลา</th><th>ตัวบน/ตัวล่าง</th><th>ชีพจร</th></tr>${data.bp.slice().reverse().map(b => `<tr><td>${Number(b.date.slice(8))}/${Number(b.date.slice(5, 7))}</td><td>${esc(b.time)}</td><td>${b.s}/${b.d}</td><td>${b.p ?? "ไม่มีข้อมูล"}</td></tr>`).join("")}</table>` : "ยังไม่มีข้อมูลใน 7 วันนี้"}
      <div class="note">แสดงตามที่ผู้ดูแลบันทึก ระบบไม่ตีความค่าและไม่วินิจฉัย โปรดปรึกษาแพทย์</div></div>`;
  } else {
    m.innerHTML = `<div class="card"><h2>บันทึกความดัน-ชีพจร</h2><form id="f">
      <div class="fields"><label>ตัวบน (mmHg)<input id="s" inputmode="numeric" required></label><label>ตัวล่าง (mmHg)<input id="d" inputmode="numeric" required></label><label>ชีพจร (ครั้ง/นาที)<input id="p" inputmode="numeric"></label></div>
      <div class="fields"><label>เวลาที่วัดจริง<input id="tm" type="time" value="${esc(data.now)}"></label></div>
      <div class="msg" id="msg"></div><button class="primary" id="go">บันทึก</button></form></div>`;
    $("f").addEventListener("submit", async e => {
      e.preventDefault(); $("go").disabled = true; $("msg").textContent = "กำลังบันทึก…";
      try { await call({ action: "bp", s: $("s").value, d: $("d").value, p: $("p").value, time: $("tm").value }); data = await call({}); tab = "today"; render(); }
      catch (err) { $("msg").textContent = "ยังไม่ได้บันทึก: " + err.message; $("go").disabled = false; }
    });
  }
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; render(); } });
(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    token = liff.getIDToken();
    data = await call({});
    $("who").textContent = `${data.patient} · ไม่ใช่ช่องทางฉุกเฉิน เหตุฉุกเฉินโทร 1669`;
    $("tabs").hidden = false; $("t-form").hidden = data.role !== "caregiver";
    if (location.hash === "#bp" && data.role === "caregiver") tab = "form";
    render();
  } catch (err) { $("who").textContent = ""; $("main").innerHTML = `<div class="card">${esc(err.message || "เปิดหน้านี้ไม่สำเร็จ")}</div>`; }
})();
</script>
</body>
</html>
